name: Build and Push Image
description: 共有 Docker イメージをビルドし、コミット SHA のタグで Artifact Registry に push する
inputs:
  ar_hostname:
    description: Artifact Registry のホスト名
    required: true
  project_id:
    description: GCP プロジェクト ID
    required: true
  workload_identity_provider:
    description: Workload Identity プロバイダ（Direct Workload Identity Federation で認証する）
    required: true
  tag_latest:
    description: latest タグも付与して push するか
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: set-image
      shell: bash
      env:
        AR_HOSTNAME: ${{ inputs.ar_hostname }}
        PROJECT_ID: ${{ inputs.project_id }}
      run: |
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        # 全 cmd ターゲットで 1 つのイメージを共有するため、タグはサービス名を含めない。
        echo "image_name=${AR_HOSTNAME}/${PROJECT_ID}/github-actions/${REPO_NAME}" >> "$GITHUB_OUTPUT"
    - name: Build
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.set-image.outputs.image_name }}
      run: |
        docker build \
        -t "${IMAGE_NAME}:${GITHUB_SHA}" \
        . \
        -f Dockerfile \
        --no-cache
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.project_id }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.project_id }}
    - name: Configure Docker
      shell: bash
      env:
        AR_HOSTNAME: ${{ inputs.ar_hostname }}
      run: |
        gcloud auth \
        configure-docker \
        "$AR_HOSTNAME"
    - name: Push
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.set-image.outputs.image_name }}
      run: |
        docker push \
        "${IMAGE_NAME}:${GITHUB_SHA}"
    # SHA タグの push が成功した場合のみ latest を更新する。
    - if: inputs.tag_latest == 'true'
      name: Push latest
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.set-image.outputs.image_name }}
      run: |
        docker tag \
        "${IMAGE_NAME}:${GITHUB_SHA}" \
        "${IMAGE_NAME}:latest"
        docker push \
        "${IMAGE_NAME}:latest"
