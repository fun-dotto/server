name: Set Environment
description: トリガーに応じて環境、共有イメージのタグ、デプロイ matrix を設定する
inputs:
  ar_hostname:
    description: Artifact Registry のホスト名
    required: true
  project_id:
    description: GCP プロジェクト ID
    required: true
  image_tag:
    description: デプロイするイメージのタグ
    required: false
    default: ${{ github.sha }}
outputs:
  environment:
    description: デプロイ先の環境（stg, prd など）
    value: ${{ steps.set-env.outputs.environment }}
  service_suffix:
    description: Cloud Run のサービス名・ジョブ名に付けるサフィックス（prd は空）
    value: ${{ steps.set-env.outputs.service_suffix }}
  image_tag:
    description: 共有 Docker イメージのタグ付き参照（全 cmd ターゲットで 1 イメージ）
    value: ${{ steps.set-env.outputs.image_tag }}
  matrix:
    description: |
      DEPLOY_TARGETS の一覧から作るデプロイ matrix の JSON。形式: {"include":[{"name","type"}]}
      type は *-api ターゲットなら "service"、それ以外は "job"。
    value: ${{ steps.set-matrix.outputs.matrix }}
runs:
  using: composite
  steps:
    - id: set-env
      shell: bash
      env:
        IS_WORKFLOW_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name != '' }}
        IS_PUSH_TO_MAIN: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
        INPUT_ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name }}
        AR_HOSTNAME: ${{ inputs.ar_hostname }}
        PROJECT_ID: ${{ inputs.project_id }}
        INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        # Environment
        if [ "$IS_WORKFLOW_DISPATCH" = "true" ]; then
          export TARGET_ENVIRONMENT="$INPUT_ENVIRONMENT_NAME"
        elif [ "$IS_PUSH_TO_MAIN" = "true" ]; then
          export TARGET_ENVIRONMENT="stg"
        else
          exit 1
        fi

        echo "Environment: $TARGET_ENVIRONMENT"

        # Service name suffix
        if [ "$TARGET_ENVIRONMENT" = "prd" ]; then
          export SERVICE_NAME_SUFFIX=""
        else
          export SERVICE_NAME_SUFFIX="-$TARGET_ENVIRONMENT"
        fi

        export REPO_NAME="${GITHUB_REPOSITORY#*/}"
        # 全 cmd ターゲットで 1 つのイメージを共有するため、タグはサービス名を含めない。
        export IMAGE_TAG="${AR_HOSTNAME}/${PROJECT_ID}/github-actions/${REPO_NAME}:${INPUT_IMAGE_TAG}"

        echo "Repository name: $REPO_NAME"
        echo "Service suffix: $SERVICE_NAME_SUFFIX"
        echo "Image tag: $IMAGE_TAG"

        echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
        echo "service_suffix=$SERVICE_NAME_SUFFIX" >> "$GITHUB_OUTPUT"
        echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
    - id: set-matrix
      shell: bash
      run: |
        # デプロイ対象を明示的に列挙する。ここに無い cmd/ ターゲット
        # (例: atlas-loader) はデプロイされない。
        # 末尾が "-api" のターゲットを Cloud Run Service、それ以外を Cloud Run Job として分類する。
        # 対象を増減するときはこの DEPLOY_TARGETS を編集する。
        DEPLOY_TARGETS="
          admin-api
          app-api
          build-class-change-notifications-job
          dispatch-notifications-job
        "
        include=""
        for name in $DEPLOY_TARGETS; do
          if [ ! -d "cmd/$name" ]; then
            echo "Deploy target cmd/$name not found" >&2
            exit 1
          fi
          case "$name" in
            *-api) type="service" ;;
            *)     type="job" ;;
          esac
          include="$include{\"name\":\"$name\",\"type\":\"$type\"},"
        done
        if [ -z "$include" ]; then
          echo "No deploy targets configured" >&2
          exit 1
        fi
        matrix="{\"include\":[${include%,}]}"
        echo "Matrix: $matrix"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
