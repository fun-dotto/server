name: Setup
description: mise でツールを入れ、Go のキャッシュを復元して依存を取得する
outputs:
  cache-hit:
    description: Go のキャッシュがキーに完全一致したか
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-key:
    description: Go のキャッシュのキー
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-path:
    description: Go のキャッシュ対象のディレクトリ（改行区切り）
    value: ${{ steps.go-env.outputs.paths }}
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        github_token: ${{ github.token }}
        cache: true

    - name: Get Go environment
      id: go-env
      shell: bash
      run: |
        {
          echo "version=$(go env GOVERSION)"
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # ジョブごとにビルドするものが違うため、キーにジョブ名を含める
    - name: Restore Go cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-env.outputs.paths }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ github.job }}-

    # mise bootstrap は go.mod を書き換えるため使わない
    - name: Download Go modules
      shell: bash
      run: go mod download
