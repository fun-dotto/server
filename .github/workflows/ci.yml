name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "0 15 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go のキャッシュは main への push と定期実行でのみ保存する。
# PR・merge queue で保存したキャッシュは他のブランチから使えず、リポジトリのキャッシュ容量を圧迫するため、復元だけ行う。
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: mise run test

      - name: Save Go cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Build all binaries
        run: mise run build

      - name: Save Go cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下のファイルが gofmt されていません:"
            echo "$unformatted"
            exit 1
          fi

      # CI では go.mod を書き換えないため、整理されていない go.mod / go.sum をここで検出する
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod / go.sum が整理されていません。go mod tidy を実行してください"
            exit 1
          fi

      - name: Lint
        run: mise run lint

      - name: Save Go cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: govulncheck
        run: mise run vulncheck

      - name: Save Go cache
        if: (github.event_name == 'push' || github.event_name == 'schedule') && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}
