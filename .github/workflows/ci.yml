name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "0 15 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # 復元したキャッシュのテスト結果で失敗を見逃さないよう、毎回実行する
      - name: Run unit tests
        run: mise run test -count=1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build all binaries
        run: mise run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go mod tidy -diff が追加で取得するモジュールも含めるため、Lint で保存する
      - name: Setup
        uses: ./.github/actions/setup
        with:
          save-mod-cache: true

      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod / go.sum が整理されていません。go mod tidy を実行してください"
            exit 1
          fi

      - name: Lint
        run: mise run lint

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: govulncheck
        run: mise run vulncheck
