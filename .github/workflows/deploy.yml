name: Deploy

# main への push: dev / stg にマイグレーションを適用してから、ビルドして latest を更新し、stg へデプロイする。
# 手動実行: action で実行範囲を選択する。デプロイする場合は、デプロイ先の環境にマイグレーションを先に適用する。
# prd も同様（GitHub Environment prd の承認が必要）。マイグレーションはデプロイするイメージと同じコミットのものを使う。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 実行内容
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - build-push-deploy
          - build-push
      environment_name:
        description: デプロイ先の環境（build-push では無視、prd は deploy でのみ指定可）
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
      image_tag:
        description: デプロイするイメージのタグ（deploy でのみ使用、未指定の場合は latest）
        required: false
        type: string
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      service_suffix: ${{ steps.set-env.outputs.service_suffix }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      matrix: ${{ steps.set-env.outputs.matrix }}
    steps:
      # prd へは、main でビルド済みのイメージを指定する deploy でのみデプロイする。
      # latest は verify-image でコミット SHA のタグに解決するため、マイグレーションとずれない。
      - if: inputs.environment_name == 'prd' && inputs.action == 'build-push-deploy'
        name: Reject prd
        run: |
          echo "prd は action: deploy でのみ実行できます" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-env
        uses: ./.github/actions/set-env
        with:
          ar_hostname: ${{ vars._AR_HOSTNAME }}
          project_id: ${{ vars.PROJECT_ID }}
          image_tag: ${{ inputs.action == 'deploy' && (inputs.image_tag || 'latest') || github.sha }}

  # deploy で指定したイメージタグを、マイグレーションの適用より前に検証する。
  # - latest（未指定）の場合は、同じダイジェストを持つコミット SHA のタグに解決する。
  #   以降のマイグレーション・デプロイは解決した SHA を使うため、latest が途中で更新されてもずれない
  # - タグ（コミット SHA）が main に含まれること。未マージのコミットのマイグレーションを適用しないため
  #   （Environment の保護ブランチ制限は github.ref しか見ない）
  # - Artifact Registry にイメージが存在すること。マイグレーションだけ適用されてデプロイが失敗するのを防ぐため
  verify-image:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    needs:
      - set-env
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ vars.PROJECT_ID }}
      - name: Resolve image tag
        id: resolve
        env:
          IMAGE: ${{ needs.set-env.outputs.image_tag }}
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          REPO="${IMAGE%:*}"
          if [ "$IMAGE_TAG" = "latest" ]; then
            DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
            if [ -z "$DIGEST" ]; then
              echo "::error::Artifact Registry にイメージがありません: $IMAGE"
              exit 1
            fi
            TAGS=$(gcloud artifacts docker images list "$REPO" --include-tags \
              --filter="version=$DIGEST" --format='value(tags)')
            COMMIT=$(echo "$TAGS" | tr ',; ' '\n\n\n' | grep -E '^[0-9a-f]{40}$' | head -n 1 || true)
            if [ -z "$COMMIT" ]; then
              echo "::error::latest ($DIGEST) に対応するコミット SHA のタグが見つかりません: $TAGS"
              exit 1
            fi
            echo "latest -> $COMMIT ($DIGEST)"
          else
            COMMIT="$IMAGE_TAG"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "image=$REPO:$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Verify commit is on main
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag は latest か 40 桁のコミット SHA を指定してください: $COMMIT"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::image_tag のコミットが main に含まれていません: $COMMIT"
            exit 1
          fi
      - name: Verify image exists
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE" > /dev/null; then
            echo "::error::Artifact Registry にイメージがありません: $IMAGE"
            exit 1
          fi

  # 全 cmd ターゲットを 1 つのイメージに同梱しているため、ビルド/プッシュは 1 回だけ実行する。
  build-and-push:
    if: inputs.action != 'deploy'
    runs-on: ubuntu-latest
    needs:
      - set-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-push-image
        with:
          ar_hostname: ${{ vars._AR_HOSTNAME }}
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          # latest は main への push でのみ更新する。
          tag_latest: ${{ github.event_name == 'push' }}

  # set-env が明示列挙した matrix で各ターゲットを並列デプロイする。対象の増減は set-env の DEPLOY_TARGETS を編集する。
  # アプリのデプロイより前に DB マイグレーションを適用する。失敗した場合はデプロイしない。
  # main への push は dev / stg、手動実行は選択した環境（build-push を除く）。
  # イメージのタグはコミット SHA のため、deploy ではそのコミットのマイグレーションを適用する
  # （latest は verify-image で解決したコミット）。イメージとマイグレーションのずれを防ぐ。
  migrate:
    if: >-
      !cancelled()
      && (github.event_name == 'push' || inputs.action != 'build-push')
      && needs.set-env.result == 'success'
      && (needs.verify-image.result == 'success' || needs.verify-image.result == 'skipped')
    # verify-image の skipped は set-env の失敗（Reject prd など）でも起きるため、set-env の成功も明示的に確認する。
    needs:
      - set-env
      - verify-image
    uses: ./.github/workflows/migrate-apply.yml
    with:
      environments: ${{ github.event_name == 'push' && '["dev","stg"]' || format('["{0}"]', inputs.environment_name) }}
      ref: ${{ inputs.action == 'deploy' && needs.verify-image.outputs.commit || github.sha }}

  deploy:
    # build-and-push / migrate がスキップされた場合もデプロイするため、結果を明示的に判定する。
    if: >-
      !cancelled()
      && inputs.action != 'build-push'
      && needs.set-env.result == 'success'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
      && (needs.verify-image.result == 'success' || needs.verify-image.result == 'skipped')
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.environment }}
    needs:
      - set-env
      - build-and-push
      - verify-image
      - migrate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-env.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/deploy-cloud-run
        with:
          name: ${{ matrix.name }}${{ needs.set-env.outputs.service_suffix }}
          type: ${{ matrix.type }}
          image: ${{ needs.verify-image.outputs.image || needs.set-env.outputs.image_tag }}
          region: ${{ vars._DEPLOY_REGION }}
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
