name: Migrate Apply

# Atlas で DB マイグレーションを適用する再利用ワークフロー。
# 呼び出し元:
# - deploy.yml: 手動デプロイで、アプリのデプロイより前にマイグレーションを完了させる（dev / stg / prd）
# - workflow_dispatch: 環境とコミット（既定は latest = main の先端）を指定して、マイグレーションだけを適用する
# 設計: docs/design/20261110_atlas_migration.md
on:
  workflow_call:
    inputs:
      environments:
        description: 適用先の環境の JSON 配列（例 ["dev","stg"]）。配列の順に 1 環境ずつ適用する
        required: true
        type: string
      ref:
        description: migrations/ を取得するコミット（デプロイするイメージのコミット）。action と atlas.hcl はワークフローのコミットのものを使う
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 適用先の環境
        required: true
        type: choice
        options:
          - dev
          - stg
          - prd
      ref:
        description: migrations/ を取得するコミット SHA（latest の場合は main の先端）
        required: false
        type: string
        default: latest

permissions:
  contents: read

env:
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: swift2023groupc:asia-northeast1:dotto

jobs:
  # 入力を解決する。workflow_dispatch では ref が main に含まれることを検証する（未マージのコミットのマイグレーションを適用しないため）。
  prepare:
    name: Migration Prepare
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Resolve inputs
        id: resolve
        env:
          CALL_ENVIRONMENTS: ${{ inputs.environments }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "environments=${CALL_ENVIRONMENTS}" >> "$GITHUB_OUTPUT"
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main
          if [ -z "$REF" ] || [ "$REF" = "latest" ]; then
            REF="$(git rev-parse origin/main)"
          elif ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref は 40 桁のコミット SHA か latest を指定してください: $REF"
            exit 1
          elif ! git merge-base --is-ancestor "$REF" origin/main; then
            echo "::error::ref のコミットが main に含まれていません: $REF"
            exit 1
          fi
          echo "適用先: ${DISPATCH_ENVIRONMENT} / migrations: ${REF}"
          echo "environments=[\"${DISPATCH_ENVIRONMENT}\"]" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

  apply:
    name: Migration Apply
    needs: prepare
    runs-on: ubuntu-latest
    # prd は承認必須・保護ブランチ限定（terraform/github/fun-dotto/repository-server.tf）
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    # 同一環境への並列実行を防ぐ（Atlas も advisory lock を取得する）
    concurrency:
      group: migrate-apply-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.prepare.outputs.environments) }}
    steps:
      # composite action・atlas.hcl はワークフローのコミット（input や SA 名と揃える）のものを使い、
      # migrations/ だけをイメージのコミットのものに差し替える。古いイメージへのロールバックでも適用できるようにするため。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout migrations at ref
        env:
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$REF"
          # ref にないマイグレーション（新しいもの）を残さないよう、ディレクトリごと差し替える
          rm -rf migrations
          git checkout FETCH_HEAD -- migrations
          git log -1 --format='migrations: %H %s' FETCH_HEAD
      - uses: ./.github/actions/atlas-migrate
        with:
          environment: ${{ matrix.environment }}
          database_name: ${{ fromJSON('{"dev":"dotto_dev","stg":"dotto_stg","prd":"dotto"}')[matrix.environment] }}
          instance_connection_name: ${{ env.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          service_account: gha-server-migrate-apply-${{ matrix.environment }}@swift2023groupc.iam.gserviceaccount.com
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.PROJECT_ID }}
          dry_run: "false"
          # 新規テーブルの owner を環境ごとの dotto_admin_<env> にする
          database_role: dotto_admin_${{ matrix.environment }}
