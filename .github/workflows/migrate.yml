name: Migrate

# DB マイグレーション（Atlas）の検証。
# - pull_request / merge_group: 静的検証と、dev / stg / prd への dry-run（DB は変更しない）。
#   マイグレーションに関係するファイルを変更した場合のみ実行し、結果は集約ジョブ Migration で報告する
# 適用はデプロイより前に完了させるため、deploy.yml から migrate-apply.yml を呼び出して行う（全環境）。
# 設計: docs/design/20261110_atlas_migration.md
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

env:
  CLOUD_SQL_INSTANCE_CONNECTION_NAME: swift2023groupc:asia-northeast1:dotto

jobs:
  # マイグレーションに関係するファイルの変更を判定する。変更がなければ validate / dry-run をスキップする。
  changes:
    name: Migration Changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      migration: ${{ steps.diff.outputs.migration }}
    steps:
      # pull_request はマージコミットと第 1 親（ベースブランチの先端）の差分を見るため、2 コミット分取得する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect changes
        id: diff
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            base="$MERGE_GROUP_BASE_SHA"
          else
            base="HEAD^1"
          fi
          # validate / dry-run の結果に影響するファイル
          paths=(
            migrations
            atlas.hcl
            cmd/atlas-loader
            internal/shared/model
            go.mod
            go.sum
            mise.toml
            .github/workflows/migrate.yml
            .github/actions/atlas-migrate
          )
          # git diff が失敗した場合も、検証を省略しないよう変更ありとして扱う
          if git diff --quiet "$base" HEAD -- "${paths[@]}"; then
            echo "マイグレーションに関係する変更はありません。validate / dry-run をスキップします"
            echo "migration=false" >> "$GITHUB_OUTPUT"
          else
            echo "マイグレーションに関係する変更があります:"
            git diff --name-only "$base" HEAD -- "${paths[@]}" || true
            echo "migration=true" >> "$GITHUB_OUTPUT"
          fi

  # 環境に依存しない静的検証。matrix にせず 1 回だけ実行する。
  validate:
    name: Migration Validate
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          github_token: ${{ github.token }}
          cache: true

      - name: Setup
        run: mise bootstrap

      # atlas.sum の整合性（atlas migrate lint は Atlas のログインが必要なため使わない）
      - name: Validate migrations
        run: mise run migrate:validate

      # モデルの変更に対するマイグレーションの生成し忘れを検出する
      - name: Check model diff
        run: |
          atlas migrate diff ci_check --env gorm
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::GORM モデルとマイグレーションに差分があります。mise run migrate:diff <name> でマイグレーションを生成してください"
            git status --porcelain migrations
            git diff migrations
            exit 1
          fi

  # 各環境の DB に接続して、未適用のリビジョンを確認する（DB は変更しない）。
  # GitHub Environment を指定しない（prd は承認必須・保護ブランチ限定のため PR で使えない）。
  # fork からの PR にはシークレット / OIDC が渡らないため対象外。
  dry-run:
    name: Migration Dry Run
    needs: changes
    if: >-
      needs.changes.outputs.migration == 'true'
      && (github.event_name == 'merge_group'
        || (github.event_name == 'pull_request'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # dry-run の結果を PR にコメントする
    concurrency:
      group: migrate-dry-run-${{ github.ref }}-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            database_name: dotto_dev
          - environment: stg
            database_name: dotto_stg
          - environment: prd
            database_name: dotto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/atlas-migrate
        with:
          environment: ${{ matrix.environment }}
          database_name: ${{ matrix.database_name }}
          instance_connection_name: ${{ env.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          service_account: gha-server-migrate-dry-run-${{ matrix.environment }}@swift2023groupc.iam.gserviceaccount.com
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.PROJECT_ID }}
          dry_run: "true"

      # dry-run の結果を PR にコメントする（環境ごとに 1 件。再実行時は同じコメントを更新する）。
      # 失敗した場合も出力を残す。merge_group には PR がないためコメントしない。
      - name: Comment dry-run result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENVIRONMENT: ${{ matrix.environment }}
          DATABASE_NAME: ${{ matrix.database_name }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- atlas-migrate-dry-run:${ENVIRONMENT} -->"
          log_file="$RUNNER_TEMP/atlas-migrate.log"
          if [ -s "$log_file" ]; then
            # コメントの上限 (65536 文字) に収まるよう末尾を残して切り詰める
            output="$(tail -c 50000 "$log_file")"
          else
            output="(atlas の出力はありません。接続前に失敗した可能性があります。ジョブのログを確認してください)"
          fi
          if [ "$JOB_STATUS" = "success" ]; then icon="✅"; else icon="❌"; fi
          body="$(printf '%s\n### %s Migration Dry Run: `%s` (`%s`)\n\n<details open><summary>atlas migrate apply --dry-run</summary>\n\n```\n%s\n```\n\n</details>\n\n[ジョブのログ](%s)\n' \
            "$marker" "$icon" "$ENVIRONMENT" "$DATABASE_NAME" "$output" "$RUN_URL")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\")))) | first | .id // empty")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

  # 必須ステータスチェック用の集約ジョブ。Ruleset にはこのジョブだけを登録し、validate / dry-run の skipped は成功として扱う。
  # matrix ジョブはスキップされると "(environment, database_name)" の付かない名前で報告されるため、直接は必須にしない。
  migration:
    name: Migration
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs:
      - changes
      - validate
      - dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DRY_RUN_RESULT: ${{ needs.dry-run.result }}
        run: |
          echo "Migration Changes: ${CHANGES_RESULT}"
          echo "Migration Validate: ${VALIDATE_RESULT}"
          echo "Migration Dry Run: ${DRY_RUN_RESULT}"
          # changes が失敗すると validate / dry-run は skipped になるため、changes は success のみ許可する
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Migration Changes が成功していません。ジョブのログを確認してください"
            exit 1
          fi
          for result in "$VALIDATE_RESULT" "$DRY_RUN_RESULT"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::Migration Validate または Migration Dry Run が成功していません。各ジョブのログを確認してください"
                exit 1
                ;;
            esac
          done
