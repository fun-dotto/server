name: Proto Generate Check

# Proto からコードを生成し、コミット済みの生成コードと差分があれば fail する。
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          github_token: ${{ github.token }}
          cache: true

      - name: Generate code from Proto
        run: buf generate

      - name: Check diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Proto から生成したコードに差分があります。buf generate を実行してコミットしてください。"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
