syntax = "proto3";

package test.v1;

enum BookFormat {
  BOOK_FORMAT_UNSPECIFIED = 0;
}

service BookService {
  rpc GetBook(GetBookRequest) returns (GetBookResponse);
}

message Book {
  string id = 1;
}

message BookAuthor {
  string name = 1;
}

message GetBookRequest {
  string id = 1;
}

message GetBookResponse {
  Book book = 1;
}
