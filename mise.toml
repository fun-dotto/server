[settings]
minimum_release_age = "7d"

[tools]
atlas = "1.2.0"
gcloud = "575.0.0"
go = "1.25.7"
# portless (npm backend) の実行に Node.js 24+ が必要
node = "24.19.0"
"npm:portless" = "0.15.5"

[tasks.setup]
description = "Install pinned tools and download Go module dependencies"
run = [
  "go get -tool github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest",
  "go mod tidy",
]

[tasks."generate:openapi"]
description = "Generate code from OpenAPI spec"
run = [
  "rm -rf ./gen",
  "mkdir -p ./gen",
  "go tool oapi-codegen -config ./api/openapi/academic/config.yaml ./api/openapi/academic/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/admin/config.yaml ./api/openapi/admin/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/announcement/config.yaml ./api/openapi/announcement/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/app/config.yaml ./api/openapi/app/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/funch/config.yaml ./api/openapi/funch/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/user/config.yaml ./api/openapi/user/openapi.yaml",
  "go tool oapi-codegen -config ./api/openapi/bus/config.yaml ./api/openapi/bus/openapi.yaml",
]

[tasks.build]
description = "Build all binaries under cmd/"
run = [
  "rm -rf ./bin",
  "mkdir -p ./bin",
  "go build -tags timetzdata -trimpath -ldflags='-s -w' -o ./bin/academic-api ./cmd/academic-api",
  "go build -tags timetzdata -trimpath -ldflags='-s -w' -o ./bin/migrate ./cmd/migrate",
  "go build -tags timetzdata -trimpath -ldflags='-s -w' -o ./bin/apply-table-privileges ./cmd/apply-table-privileges",
  "go build -tags timetzdata -trimpath -ldflags='-s -w' -o ./bin/build-class-change-notifications-job ./cmd/build-class-change-notifications-job",
  "go build -tags timetzdata -trimpath -ldflags='-s -w' -o ./bin/dispatch-notifications-job ./cmd/dispatch-notifications-job",
]

[tasks."migrate:diff"]
description = "GORM モデルから desired state を生成し、versioned SQL の差分を migrations/ に書き出す (atlas CLI / env=local)"
usage = '''
arg "name" help="生成するマイグレーション名 (省略可、例: add_users_table)" default=""
'''
run = 'atlas migrate diff {{arg(name="name")}} --env gorm'

[tasks."migrate:apply"]
description = "cmd/migrate を起動し、cloudsqlconn (IAM 認証) で接続した DB に migrations/ を適用する"
run = "go run ./cmd/migrate"

[tasks.academic-api]
description = "cmd/academic-api を portless 経由で起動する (https://academic-api.dotto.localhost)"
run = "portless academic-api.dotto go run ./cmd/academic-api"

[tasks.user-api]
description = "cmd/user-api を portless 経由で起動する (https://user-api.dotto.localhost)"
run = "portless user-api.dotto go run ./cmd/user-api"

[tasks.announcement-api]
description = "cmd/announcement-api を portless 経由で起動する (https://announcement-api.dotto.localhost)"
run = "portless announcement-api.dotto go run ./cmd/announcement-api"

[tasks."portless:doctor"]
description = "portless のプロキシ・DNS・CA 信頼状態を確認する"
run = "portless doctor"

[tasks."portless:list"]
description = "portless に登録されているルートを一覧する"
run = "portless list"

[tasks."portless:stop"]
description = "portless のプロキシを停止する"
run = "portless proxy stop"

[tasks.test]
description = "Run all unit tests"
run = "go test -v ./..."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf ./bin"
