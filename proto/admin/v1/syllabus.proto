  // 担当教員名。
  string faculty_names = 6 [(google.api.field_behavior) = OPTIONAL];
  // 実務家教員区分。
  string practical_home_faculty_category = 7 [(google.api.field_behavior) = OPTIONAL];
  // 複数人担当形式。
  string multiple_person_teaching_form = 8 [(google.api.field_behavior) = OPTIONAL];
  // 授業形態。
  string teaching_form = 9 [(google.api.field_behavior) = OPTIONAL];
  // 授業の概要。
  string summary = 10 [(google.api.field_behavior) = OPTIONAL];
  // 授業の到達目標。
