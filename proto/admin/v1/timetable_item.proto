syntax = "proto3";

package admin.v1;

import "admin/v1/common.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/dayofweek.proto";

// 時間割の項目を管理する。
service TimetableItemService {
  // 時間割の項目の一覧を取得する。
  rpc ListTimetableItems(ListTimetableItemsRequest) returns (ListTimetableItemsResponse);
  // 時間割の項目を取得する。
  rpc GetTimetableItem(GetTimetableItemRequest) returns (GetTimetableItemResponse);
  // 時間割の項目を作成する。
  rpc CreateTimetableItem(CreateTimetableItemRequest) returns (CreateTimetableItemResponse);
  // 時間割の項目を更新する。
  rpc UpdateTimetableItem(UpdateTimetableItemRequest) returns (UpdateTimetableItemResponse);
  // 時間割の項目を削除する。
  rpc DeleteTimetableItem(DeleteTimetableItemRequest) returns (DeleteTimetableItemResponse);
}

// 時間割の項目。
message TimetableItem {
  // ID。
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 科目の ID。
  string subject_id = 2 [(google.api.field_behavior) = REQUIRED];
  // 曜日。集中講義など曜日がない場合は未設定。
  optional google.type.DayOfWeek day_of_week = 3 [(google.api.field_behavior) = OPTIONAL];
  // 時限。集中講義など時限がない場合は未設定。
  optional Period period = 4 [(google.api.field_behavior) = OPTIONAL];
  // 使う教室の ID。
  repeated string room_ids = 5 [(google.api.field_behavior) = OPTIONAL];
  // 作成日時。
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 更新日時。
  google.protobuf.Timestamp updated_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListTimetableItems の Request。
message ListTimetableItemsRequest {
  // 1 ページあたりの最大件数。0 の場合はサーバーの既定値（50）を使い、上限（1000）を超えた値は上限に丸める。
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // 前回の List で返された next_page_token。最初のページを取得する場合は空文字。
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ListTimetableItems の Response。
message ListTimetableItemsResponse {
  // 時間割の項目の一覧。
  repeated TimetableItem timetable_items = 1;
  // 次のページを取得するためのトークン。最終ページの場合は空文字。
  string next_page_token = 2;
}

// GetTimetableItem の Request。
message GetTimetableItemRequest {
  // 取得する時間割の項目の ID。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetTimetableItem の Response。
message GetTimetableItemResponse {
  // 取得した時間割の項目。
  TimetableItem timetable_item = 1;
}

// CreateTimetableItem の Request。
message CreateTimetableItemRequest {
  // 科目の ID。
  string subject_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 曜日。集中講義など曜日がない場合は未設定。
  optional google.type.DayOfWeek day_of_week = 2 [(google.api.field_behavior) = OPTIONAL];
  // 時限。集中講義など時限がない場合は未設定。
  optional Period period = 3 [(google.api.field_behavior) = OPTIONAL];
  // 使う教室の ID。
  repeated string room_ids = 4 [(google.api.field_behavior) = OPTIONAL];
}

// CreateTimetableItem の Response。
message CreateTimetableItemResponse {
  // 作成した時間割の項目。
  TimetableItem timetable_item = 1;
}

// UpdateTimetableItem の Request。
message UpdateTimetableItemRequest {
  // 更新する時間割の項目の ID。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // 科目の ID。
  string subject_id = 2 [(google.api.field_behavior) = OPTIONAL];
  // 曜日。集中講義など曜日がない場合は未設定。
  optional google.type.DayOfWeek day_of_week = 3 [(google.api.field_behavior) = OPTIONAL];
  // 時限。集中講義など時限がない場合は未設定。
  optional Period period = 4 [(google.api.field_behavior) = OPTIONAL];
  // 使う教室の ID。
  repeated string room_ids = 5 [(google.api.field_behavior) = OPTIONAL];
  // 更新するフィールド。空の場合は値が入っているフィールドをすべて更新する。
  google.protobuf.FieldMask update_mask = 99 [(google.api.field_behavior) = OPTIONAL];
}

// UpdateTimetableItem の Response。
message UpdateTimetableItemResponse {
  // 更新した時間割の項目。
  TimetableItem timetable_item = 1;
}

// DeleteTimetableItem の Request。
message DeleteTimetableItemRequest {
  // 削除する時間割の項目の ID。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteTimetableItem の Response。
message DeleteTimetableItemResponse {}
