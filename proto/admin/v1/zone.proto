syntax = "proto3";

package admin.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

// 運賃エリア（GTFS の zone_id）を管理する。
service ZoneService {
  // 運賃エリア（GTFS の zone_id）の一覧を取得する。
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);
  // 運賃エリア（GTFS の zone_id）を取得する。
  rpc GetZone(GetZoneRequest) returns (GetZoneResponse);
  // 運賃エリア（GTFS の zone_id）を作成する。
  rpc CreateZone(CreateZoneRequest) returns (CreateZoneResponse);
  // 運賃エリア（GTFS の zone_id）を更新する。
  rpc UpdateZone(UpdateZoneRequest) returns (UpdateZoneResponse);
  // 運賃エリア（GTFS の zone_id）を削除する。
  rpc DeleteZone(DeleteZoneRequest) returns (DeleteZoneResponse);
}

// 運賃エリア（GTFS の zone_id）。
message Zone {
  // 運賃エリアID（GTFS の zone_id）。
  string zone_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListZones の Request。
message ListZonesRequest {
  // 1 ページあたりの最大件数。0 の場合はサーバーの既定値（50）を使い、上限（1000）を超えた値は上限に丸める。
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // 前回の List で返された next_page_token。最初のページを取得する場合は空文字。
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ListZones の Response。
message ListZonesResponse {
  // 運賃エリア（GTFS の zone_id）の一覧。
  repeated Zone zones = 1;
  // 次のページを取得するためのトークン。最終ページの場合は空文字。
  string next_page_token = 2;
}

// GetZone の Request。
message GetZoneRequest {
  // 運賃エリアID（GTFS の zone_id）。
  string zone_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetZone の Response。
message GetZoneResponse {
  // 取得した運賃エリア（GTFS の zone_id）。
  Zone zone = 1;
}

// CreateZone の Request。
message CreateZoneRequest {
  // 運賃エリアID（GTFS の zone_id）。
  string zone_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateZone の Response。
message CreateZoneResponse {
  // 作成した運賃エリア（GTFS の zone_id）。
  Zone zone = 1;
}

// UpdateZone の Request。
message UpdateZoneRequest {
  // 運賃エリアID（GTFS の zone_id）。
  string zone_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 更新するフィールド。空の場合は値が入っているフィールドをすべて更新する。
  google.protobuf.FieldMask update_mask = 99 [(google.api.field_behavior) = OPTIONAL];
}

// UpdateZone の Response。
message UpdateZoneResponse {
  // 更新した運賃エリア（GTFS の zone_id）。
  Zone zone = 1;
}

// DeleteZone の Request。
message DeleteZoneRequest {
  // 運賃エリアID（GTFS の zone_id）。
  string zone_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteZone の Response。
message DeleteZoneResponse {}
