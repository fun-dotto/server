syntax = "proto3";

package app.v1;

import "app/v1/bus_route.proto";
import "app/v1/bus_stop.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

// バスの運行情報を提供する。
service BusTripService {
  // バスの運行情報の一覧を取得する。
  rpc ListBusTrips(ListBusTripsRequest) returns (ListBusTripsResponse);
}

// バスの運行情報。
message BusTrip {
  // ID。
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 出発日時。
  google.protobuf.Timestamp departure_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 到着日時。
  google.protobuf.Timestamp arrival_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 路線。
  BusRoute route = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 乗車バス停、乗り換えバス停、降車バス停のリスト。
  repeated BusStop stops = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 遅延時間。
  google.protobuf.Duration delay = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 運行の注意情報。
  BusTripAlert alert = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListBusTrips の Request。
message ListBusTripsRequest {
  // 1 ページあたりの最大件数。0 の場合はサーバーの既定値（50）を使い、上限（1000）を超えた値は上限に丸める。
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // 前回の List で返された next_page_token。最初のページを取得する場合は空文字。
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // 運行情報を取得する日付。
  google.type.Date date = 3 [(google.api.field_behavior) = REQUIRED];
}

// ListBusTrips の Response。
message ListBusTripsResponse {
  // バスの運行情報の一覧。
  repeated BusTrip bus_trips = 1;
  // 次のページを取得するためのトークン。最終ページの場合は空文字。
  string next_page_token = 2;
}

// バスの運行の注意情報。
enum BusTripAlert {
  // 未指定。
  BUS_TRIP_ALERT_UNSPECIFIED = 0;
  // なし。
  BUS_TRIP_ALERT_NONE = 1;
  // 運休。
  BUS_TRIP_ALERT_CANCELLATION = 2;
}
