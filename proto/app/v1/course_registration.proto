syntax = "proto3";

package app.v1;

import "app/v1/subject.proto";
import "google/api/field_behavior.proto";

// ログイン中のユーザーの履修情報を管理する。
service CourseRegistrationService {
  // 履修情報の一覧を取得する。
  rpc ListCourseRegistrations(ListCourseRegistrationsRequest) returns (ListCourseRegistrationsResponse);
  // 履修情報を作成する。
  rpc CreateCourseRegistration(CreateCourseRegistrationRequest) returns (CreateCourseRegistrationResponse);
  // 履修情報を削除する。
  rpc DeleteCourseRegistration(DeleteCourseRegistrationRequest) returns (DeleteCourseRegistrationResponse);
}

// 履修情報。
message CourseRegistration {
  // ID。
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 科目。
  Subject subject = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListCourseRegistrations の Request。
message ListCourseRegistrationsRequest {
  // 1 ページあたりの最大件数。0 の場合はサーバーの既定値（50）を使い、上限（1000）を超えた値は上限に丸める。
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // 前回の List で返された next_page_token。最初のページを取得する場合は空文字。
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
  // 開講年度。未設定の場合は今年度。
  optional int32 year = 3 [(google.api.field_behavior) = OPTIONAL];
  // 開講時期。
  repeated SubjectSemester semesters = 4 [(google.api.field_behavior) = REQUIRED];
}

// ListCourseRegistrations の Response。
message ListCourseRegistrationsResponse {
  // 履修情報の一覧。
  repeated CourseRegistration course_registrations = 1;
  // 次のページを取得するためのトークン。最終ページの場合は空文字。
  string next_page_token = 2;
}

// CreateCourseRegistration の Request。
message CreateCourseRegistrationRequest {
  // 履修する科目ID。
  string subject_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// CreateCourseRegistration の Response。
message CreateCourseRegistrationResponse {
  // 作成した履修情報。
  CourseRegistration course_registration = 1;
}

// DeleteCourseRegistration の Request。
message DeleteCourseRegistrationRequest {
  // 削除する履修情報ID。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteCourseRegistration の Response。
message DeleteCourseRegistrationResponse {}
