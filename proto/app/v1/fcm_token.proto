syntax = "proto3";

package app.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// ログイン中のユーザーの FCM トークンを管理する。
service FcmTokenService {
  // FCM トークンを登録する。存在しない場合は作成し、存在する場合は更新日時を更新する。
  // 他のユーザーに登録済みのトークンの場合は PERMISSION_DENIED を返す。
  rpc RegisterFcmToken(RegisterFcmTokenRequest) returns (RegisterFcmTokenResponse);
}

// FCM トークン。
message FcmToken {
  // FCM トークン。
  string token = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 作成日時。
  google.protobuf.Timestamp created_at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 更新日時。
  google.protobuf.Timestamp updated_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// RegisterFcmToken の Request。
message RegisterFcmTokenRequest {
  // 登録する FCM トークン。
  string token = 1 [(google.api.field_behavior) = REQUIRED];
}

// RegisterFcmToken の Response。
message RegisterFcmTokenResponse {
  // 登録した FCM トークン。
  FcmToken fcm_token = 1;
}
