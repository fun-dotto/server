syntax = "proto3";

package app.v1;

import "app/v1/common.proto";
import "app/v1/subject.proto";
import "google/api/field_behavior.proto";
import "google/type/date.proto";

// 補講を提供する。
service MakeupClassService {
  // 補講の一覧を取得する。
  rpc ListMakeupClasses(ListMakeupClassesRequest) returns (ListMakeupClassesResponse);
}

// 補講。
message MakeupClass {
  // ID。
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 科目。
  Subject subject = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 日付。
  google.type.Date date = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 時限。
  Period period = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 補足のコメント。
  string comment = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListMakeupClasses の Request。
message ListMakeupClassesRequest {
  // 科目IDのリスト。指定した科目の補講のみを取得する。空の場合は全科目を対象とする。
  repeated string subject_ids = 1 [(google.api.field_behavior) = OPTIONAL];
  // 検索対象の開始日付。未設定の場合は開始日付で絞り込まない。
  optional google.type.Date from_date = 2 [(google.api.field_behavior) = OPTIONAL];
  // 検索対象の終了日付。未設定の場合は終了日付で絞り込まない。
  optional google.type.Date until_date = 3 [(google.api.field_behavior) = OPTIONAL];
}

// ListMakeupClasses の Response。
message ListMakeupClassesResponse {
  // 補講の一覧。
  repeated MakeupClass makeup_classes = 1;
}
