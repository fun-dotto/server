syntax = "proto3";

package app.v1;

import "app/v1/room.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// 教室の予約を提供する。
service ReservationService {
  // 教室の予約の一覧を取得する。検索対象期間に一部でも重複する予約を取得する。
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
}

// 教室の予約。
message Reservation {
  // ID。
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 教室。
  Room room = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 開始日時。
  google.protobuf.Timestamp start_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // 終了日時。
  google.protobuf.Timestamp end_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // タイトル。
  string title = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ListReservations の Request。
message ListReservationsRequest {
  reserved 1, 2;
  reserved "page_size", "page_token";

  // 教室IDのリスト。空の場合は全教室を対象とする。
  repeated string room_ids = 3 [(google.api.field_behavior) = OPTIONAL];
  // 検索対象の開始日時。未設定の場合は開始日時で絞り込まない。
  optional google.protobuf.Timestamp from_time = 4 [(google.api.field_behavior) = OPTIONAL];
  // 検索対象の終了日時。未設定の場合は終了日時で絞り込まない。
  optional google.protobuf.Timestamp until_time = 5 [(google.api.field_behavior) = OPTIONAL];
}

// ListReservations の Response。
message ListReservationsResponse {
  // 教室の予約の一覧。
  repeated Reservation reservations = 1;

  reserved 2;
  reserved "next_page_token";
}
